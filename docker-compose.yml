version: "3.7"

services:

  flask:
    build: ./flask
    container_name: template_flask
    volumes:
      - ./flask:/flask
    # restart: always
    environment:
      - APP_NAME=FlaskApp
    expose:
      - 8080
    depends_on:
      - db
      
  db:
    image: mysql
    container_name: template_mysql
    volumes:
      - ./mysql/mysql_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: brucechen
      MYSQL_DATABASE: mysql
    ports:
      - 3306:3306


  nginx:
    build: ./nginx
    container_name: template_nginx
    # restart: always
    ports:
      - "80:80"
      - "443:443"

    depends_on:
      - flask